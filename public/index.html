    <main class="lb-main">

        <div class="lb-board-head">
          <div class="lb-board-title">
            <svg class="lb-trophy" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M12 6h24v6c0 8-4 14-9 16v6h5v6H16v-6h5v-6c-5-2-9-8-9-16Z" fill="url(#lbGold)" stroke="#e8a20c" stroke-width="1.6"/>

            <div>
              <h2>员工提成排行榜</h2>
              <p id="lbBoardSub">TOP 10 ｜ 本月提成排名</p>
            </div>
          </div>
          <div class="lb-board-cheer">
            <svg viewBox="0 0 40 32" aria-hidden="true"><path d="M4 26 2 8l10 7L22 2l9 13 9-6-2 17Z" fill="#ffd94a" stroke="#f0b429" stroke-width="1.8" stroke-linejoin="round"/><circle cx="22" cy="2" r="2.4" fill="#ffd94a" stroke="#f0b429" stroke-width="1.2"/><circle cx="2" cy="8" r="2" fill="#ffd94a" stroke="#f0b429" stroke-width="1.2"/><circle cx="40" cy="9" r="2" fill="#ffd94a" stroke="#f0b429" stroke-width="1.2"/></svg>

        </div>

            <span role="columnheader">排名</span>
            <span role="columnheader">员工信息</span>
            <span role="columnheader">本月提成</span>
            <span role="columnheader">总提成</span>
            <span role="columnheader">目标进度</span>
          </div>
          <div id="lbRows" class="lb-tbody"></div>
        </div>
      </section>

          <div class="lb-card-title">

          </div>
          <strong class="lb-total-amount" id="lbTotal">¥ 0.00</strong>
          <p class="lb-total-trend" id="lbTrend"></p>

            <svg viewBox="0 0 150 90">

              <text x="34" y="56" text-anchor="middle" font-size="9" font-weight="700" fill="#a86a00">¥</text>
            </svg>

          <div class="lb-card-title lb-goal-head">

          </div>
          <div class="lb-progress lb-progress-lg" role="progressbar" aria-label="本月目标进度">
            <div class="lb-progress-fill" id="lbGoalBar"></div>

            <div><b>目标提示</b><p id="lbGoalHint">正在读取目标设定…</p></div>
          </div>
        </article>

        <article class="lb-card lb-card-motto">
